readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "opencv-python>=4.13.0",
    "osmium>=4.2.0",
    "pandas>=3.0.1",
    "pyaudio>=0.2.14",
    "resampy>=0.4.3",
    "rich>=14.3.3",
    "scipy>=1.18.1",
    "scikit-learn>=1.8.0",
    "torch>=2.13.0",
    "tqdm>=4.67.3",
    "traci==1.27.1",
    "ultralytics>=8.4.33",
]
